{{define "chat.html"}}
{{template "layout-head" .}}
<section class="war-room">
    <aside class="wr-rail wr-rail-left">
        <div class="wr-rail-head">
            <h2 class="wr-label">Operations <button type="button" class="hint" data-hint="operations"></button></h2>
            <button id="new-chat-button" type="button" class="wr-mini-btn" title="Start a new conversation">
                <span aria-hidden="true">+</span> New
            </button>
        </div>
        <div id="chat-sessions" class="chat-sessions"></div>

        <section id="loops" class="loops">
            <div class="loops-head">
                <h2 class="wr-label">Open loops <span id="loops-count" class="loops-count"></span> <button type="button" class="hint" data-hint="loops"></button></h2>
            </div>
            <ul id="loops-list" class="loops-list"></ul>
            <form id="loops-add" class="loops-add">
                <input name="text" type="text" placeholder="Add something you'll do" autocomplete="off" maxlength="240">
                <input name="due" type="date" aria-label="Due date">
            </form>
        </section>
    </aside>

    <section class="wr-main">
        <header class="situation" aria-label="Situation">
            <span class="sit-brand">Briefing</span>
            <span id="sit-clock" class="sit-clock"></span>
            <span class="sit-chips">
                <span id="sit-loops" class="sit-chip warn" hidden></span>
                <span id="sit-next" class="sit-chip" hidden></span>
                <button id="checkin-now" type="button" class="sit-chip action" title="Ask me how it's going, now">Check in now</button>
                <button type="button" class="hint" data-hint="checkins"></button>
                <span class="mode-chip-wrap">
                    <button id="mode-chip" type="button" class="mode-chip" aria-haspopup="listbox" aria-expanded="false">
                        <span id="mode-chip-label">Open</span>
                        <span class="mode-chip-caret" aria-hidden="true">▾</span>
                    </button>
                    <div id="mode-menu" class="mode-menu" role="listbox" hidden></div>
                </span>
                <button type="button" class="hint" data-hint="mode"></button>
            </span>
        </header>

        <form id="capture-form" class="capture" title="Appends a timestamped line to today's daily note">
            <input id="capture-input" name="text" type="text" autocomplete="off"
                   placeholder="Log a line to today's note — no chat, no answer">
            <button type="submit" class="wr-mini-btn">Log</button>
            <button type="button" class="hint" data-hint="capture"></button>
        </form>
        <div id="capture-result" class="capture-result"></div>

        <div id="checkin-cards" class="checkin-cards"></div>

        <div id="chat-messages" class="chat-messages"></div>

        <form id="consult-form" class="chat-form">
            <div id="interrogation-bar" class="interrogation-bar" hidden>
                <span class="interrogation-bar-label">Interrogation</span>
                <span id="interrogation-who" class="interrogation-who">The council is asking</span>
                <button type="button" class="hint" data-hint="interrogation"></button>
                <span class="interrogation-bar-actions">
                    <button id="take-position" type="button" class="btn-secondary take-position" title="End the questioning and write the position it earned">Take a position</button>
                    <button id="leave-interrogation" type="button" class="btn-secondary" title="Back to ordinary advice">Leave</button>
                </span>
            </div>
            <textarea id="question" name="question" rows="3"
                      placeholder="State the situation. What are you deciding?" required></textarea>

            <div class="chat-form-controls">
                <fieldset class="tier-picker" aria-label="Answer depth">
                    <label title="A few memories, no digging. Seconds.">
                        <input type="radio" name="tier" value="quick"><span>Quick</span>
                    </label>
                    <label title="Full retrieval, one round of digging if context is thin.">
                        <input type="radio" name="tier" value="standard" checked><span>Standard</span>
                    </label>
                    <label title="Wider search, keeps digging. Slow and thorough.">
                        <input type="radio" name="tier" value="deep"><span>Deep</span>
                    </label>
                </fieldset>
                <button type="button" class="hint" data-hint="depth"></button>

                <button type="submit" class="btn primary">Brief me</button>
            </div>
        </form>

        <div id="consult-result" class="consult-result"></div>
    </section>

    <aside class="wr-rail wr-rail-right" aria-label="Council">
        <div class="wr-rail-head">
            <h2 class="wr-label">Council <button type="button" class="hint" data-hint="council"></button></h2>
            <span id="generals-summary" class="wr-hint"></span>
        </div>
        <div id="council-seats" class="council-seats"></div>

        <div class="wr-rail-head roster-head">
            <h2 class="wr-label">Roster <button type="button" class="hint" data-hint="roster"></button></h2>
        </div>
        <div id="generals-strip" class="roster"></div>
        <p class="wr-footnote">
            Generals are operational lenses, not endorsements.
            <a href="https://github.com/an4eetos/decision_making_room/blob/main/docs/generals.md" target="_blank" rel="noopener">Why these twenty</a>
        </p>
    </aside>
</section>
{{template "layout-foot" .}}
{{end}}
