services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: decision_room
      POSTGRES_USER: room
      POSTGRES_PASSWORD: room
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U room -d decision_room"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional: only needed when LLM_PROVIDER=ollama.
  ollama:
    image: ollama/ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  app:
    build: .
    profiles: ["app"]
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://room:room@postgres:5432/decision_room?sslmode=disable
      HTTP_ADDR: ":8080"
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_BASE_URL: http://ollama:11434
      JOURNAL_WATCH_DIR: /journal
      ABOUT_ME_FILE: /journal/about-me.md
      CONTEXT_DIR: /journal/context
    volumes:
      - ./journal:/journal
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  ollama:
